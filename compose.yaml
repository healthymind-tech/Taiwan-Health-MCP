services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: taiwanHealthMcp_postgres
    # Docker's 64 MB default is too small for parallel HNSW builds / parallel queries.
    shm_size: 1gb
    # autoprewarm: restore the buffer cache (SNOMED HNSW index etc.) after a restart.
    command: ["postgres", "-c", "shared_preload_libraries=pg_prewarm", "-c", "pg_prewarm.autoprewarm=true"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taiwan_health}
      POSTGRES_USER: ${POSTGRES_USER:-mcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mcp} -d ${POSTGRES_DB:-taiwan_health}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: taiwanHealthMcp_pgbouncer
    environment:
      DB_USER: ${POSTGRES_USER:-mcp}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-taiwan_health}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 30
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 10
      RESERVE_POOL_TIMEOUT: 3
      # Re-try backend logins after 2 s (default 15 s) so a Postgres restart is a short blip, not a 30 s outage.
      SERVER_LOGIN_RETRY: 2
      SERVER_IDLE_TIMEOUT: 600
      SERVER_LIFETIME: 3600
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: taiwanHealthMcp_redis
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: taiwanHealthMcp_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    # MCP + admin REST surface, ported to Node (node-server/dist/server.js).
    # Serves the full nginx-routed app surface: /mcp, /admin/api, /admin/ws,
    # /openapi.json, /tools/*, /fhir-client/*, /fhir-oauth/*.
    build:
      context: .
      dockerfile: node-server/Dockerfile
      args:
        BUILD_SHA: ${BUILD_SHA:-dev}
    container_name: taiwanHealthMcp
    # `ocr`: internal network shared with ocr-indra only.
    networks:
      - default
      - ocr
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No public host port: the MCP/admin app is reached only through the nginx
    # front door (:${WEB_PORT}). nginx proxies /mcp, /admin/api, /admin/ws, etc.
    # to it over the compose network. Set MCP host-publish back via `ports:` only
    # if a host-local MCP client must connect to :${MCP_PORT} directly.
    expose:
      - "${MCP_PORT:-8000}"
    ports:
      - "127.0.0.1:${METRICS_PORT:-9090}:${METRICS_PORT:-9090}"
    # No source volume mounts: the Node app runs from the baked-in dist/. (The
    # old Python app mounted ./src + ./static; static public pages are served by
    # the `web` Next.js service, not the app.)
    environment:
      - MCP_HOST=${MCP_HOST:-0.0.0.0}
      - MCP_PORT=${MCP_PORT:-8000}
      - MCP_PATH=${MCP_PATH:-/mcp}
      - PUBLIC_TOOLS_AUTH_MODE=${PUBLIC_TOOLS_AUTH_MODE:-none}
      - PUBLIC_TOOLS_BEARER_TOKEN=${PUBLIC_TOOLS_BEARER_TOKEN:-}
      - PUBLIC_TOOLS_CORS_ORIGINS=${PUBLIC_TOOLS_CORS_ORIGINS:-}
      # Connect through pgBouncer (transaction mode — asyncpg uses statement_cache_size=0)
      # edoburu/pgbouncer listens on port 5432 internally
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mcp}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-taiwan_health}
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ADMIN_ENABLED=${ADMIN_ENABLED:-true}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:-}
      - ADMIN_COOKIE_SECURE=${ADMIN_COOKIE_SECURE:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-}
      - WEBAUTHN_RP_NAME=${WEBAUTHN_RP_NAME:-}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-}
      # Symmetric pgcrypto key for FHIR OAuth tokens / client secrets
      # (falls back to ADMIN_SESSION_SECRET when unset). Must match admin-worker.
      - FHIR_SERVER_SECRET_KEY=${FHIR_SERVER_SECRET_KEY:-}
      - ADMIN_SESSION_TTL_MINUTES=${ADMIN_SESSION_TTL_MINUTES:-240}
      - ADMIN_MAX_UPLOAD_MB=${ADMIN_MAX_UPLOAD_MB:-512}
      - METRICS_PORT=${METRICS_PORT:-9090}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-taiwan-health-drug-assets}
      - MINIO_SECURE=${MINIO_SECURE:-false}
      - MINIO_PRESIGN_TTL_SECONDS=${MINIO_PRESIGN_TTL_SECONDS:-3600}
      - DRUG_TFDA_BASE_URL=${DRUG_TFDA_BASE_URL:-https://mcp.fda.gov.tw}
      - DRUG_HTTP_TIMEOUT=${DRUG_HTTP_TIMEOUT:-30}
      - DRUG_CRAWLER_CONCURRENCY=${DRUG_CRAWLER_CONCURRENCY:-4}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: taiwanHealthMcp_minio_init
    entrypoint: >
      /bin/sh -c "
        until mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin}; do
          echo 'Waiting for MinIO...'; sleep 2;
        done;
        mc mb --ignore-existing local/${MINIO_BUCKET:-taiwan-health-drug-assets};
        mc anonymous set none local/${MINIO_BUCKET:-taiwan-health-drug-assets};
        echo 'MinIO bucket ready.';
      "
    environment:
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-taiwan-health-drug-assets}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  admin-worker:
    # Node worker: every job type (file loaders, embeddings, drug pipeline).
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        BUILD_SHA: ${BUILD_SHA:-dev}
    container_name: taiwanHealthMcp_admin_worker
    # CMD in Dockerfile.worker runs `node dist/admin/adminWorker.js`.
    networks:
      - default
      - ocr
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mcp}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-taiwan_health}
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Required so the worker can pgp_sym_decrypt FHIR OAuth tokens / client
      # secrets (same key as `app`; falls back to ADMIN_SESSION_SECRET). Without
      # it the key is empty and pgcrypto raises "Illegal argument to function".
      - FHIR_SERVER_SECRET_KEY=${FHIR_SERVER_SECRET_KEY:-}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:-}
      - ADMIN_WORKER_NAME=${ADMIN_WORKER_NAME:-admin-worker}
      - ADMIN_WORKER_POLL_SECONDS=${ADMIN_WORKER_POLL_SECONDS:-3}
      - ADMIN_HEARTBEAT_INTERVAL_SECONDS=${ADMIN_HEARTBEAT_INTERVAL_SECONDS:-15}
      - ADMIN_WORKER_STALE_AFTER_SECONDS=${ADMIN_WORKER_STALE_AFTER_SECONDS:-45}
      - ADMIN_MAX_CONCURRENT_JOBS=${ADMIN_MAX_CONCURRENT_JOBS:-4}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-taiwan-health-drug-assets}
      - MINIO_SECURE=${MINIO_SECURE:-false}
      - MINIO_PRESIGN_TTL_SECONDS=${MINIO_PRESIGN_TTL_SECONDS:-3600}
      # Headroom for the big imports: the drug index is a 44 MB / ~66k-row CSV, and
      # an IG import pulls in dependency packages as large as hl7.fhir.r4.examples.
      # Node's own default (~4 GB) is not enough for the latter.
      - NODE_OPTIONS=--max-old-space-size=8192
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # ── OCR: Indra (CPU-only, optional second OCR provider for drug inserts) ──────
  # The only Python in the repo (services/ocr-indra). Nothing uses it until an
  # operator picks provider `indra` (or fallback `indra`) in admin → 外部服務 → OCR;
  # its base URL there is http://ocr-indra:8000. No host port, and the `ocr`
  # network is internal (no route out): uploaded inserts cannot leave this box.
  # Model weights are baked into the image (modified OpenRAIL-M licence — see
  # services/ocr-indra/README.md before enabling it).
  ocr-indra:
    build:
      context: ./services/ocr-indra
    image: taiwan-health-mcp-ocr-indra:latest
    container_name: taiwanHealthMcp_ocr_indra
    restart: unless-stopped
    networks:
      - ocr
    expose:
      - "8000"
    environment:
      - INDRA_WORKERS=${INDRA_WORKERS:-1}
      - INDRA_THREADS_PER_WORKER=${INDRA_THREADS_PER_WORKER:-2}
      - INDRA_MAX_PAGES=${INDRA_MAX_PAGES:-60}
      - INDRA_MAX_UPLOAD_MB=${INDRA_MAX_UPLOAD_MB:-50}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    cpus: 2
    mem_limit: 2g
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # ── Admin console v2 (static Vite SPA served by its own nginx) ────────────────
  # nginx (below) routes /admin pages here; API / MCP / WS still go straight to
  # `app`. web-v2's own nginx can also proxy the backend (BACKEND_UPSTREAM), so it
  # can stand alone as a front door (see deploy/staging/compose.yaml).
  web-v2:
    build:
      context: ./web-v2
    image: taiwan-health-mcp-web-v2:latest
    container_name: taiwanHealthMcp_web_v2
    restart: unless-stopped
    environment:
      - BACKEND_UPSTREAM=app:${MCP_PORT:-8000}
    depends_on:
      - app
    expose:
      - "80"

  # ── Legacy Next.js admin (replaced by web-v2) ─────────────────────────────────
  # Kept only for rollback; not started by default. To bring it back:
  #   docker compose --profile legacy-web up -d web   (and restore nginx.conf)
  web:
    profiles: ["legacy-web"]
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: taiwanHealthMcp_web
    restart: unless-stopped
    environment:
      - BACKEND_INTERNAL_URL=http://app:${MCP_PORT:-8000}
    depends_on:
      - app
    expose:
      - "3000"

  # ── nginx single front door (routes API/MCP/WS -> app, rest -> web-v2) ────────
  nginx:
    image: nginx:1.27-alpine
    container_name: taiwanHealthMcp_nginx
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web-v2
      - app

networks:
  default:
  # No external route: only app, admin-worker and ocr-indra are attached.
  ocr:
    internal: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
