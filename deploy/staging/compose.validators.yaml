# v18 R1 on staging: the official HL7 validators (services/hl7-validator, one per IG) as the judge of fhir_validate_*.
# Use together with compose.limits.yaml:
#   docker compose -p twh-staging -f deploy/staging/compose.yaml -f deploy/staging/compose.limits.yaml \
#     -f deploy/staging/compose.validators.yaml up -d --no-build
# Each validator: 3 GB / 2 CPU, low CPU priority, no host port; outbound HTTPS for packages.fhir.org / tx.fhir.org.
x-validator: &validator
  image: taiwan-health-mcp-hl7-validator:latest
  restart: unless-stopped
  expose:
    - "8080"
  volumes:
    - validator_fhircache:/root/.fhir
  cpus: 2
  cpu_shares: 256
  mem_limit: 3g
  # no core dump on a JVM crash (it would land in the container layer)
  ulimits:
    core: 0
  memswap_limit: 3g
  pids_limit: 512
  security_opt:
    - no-new-privileges:true
  healthcheck:
    # ready = warm-up done (entrypoint.sh) and the port answers (bash: the image's sh has no /dev/tcp)
    test: ["CMD", "bash", "-c", "test -f /tmp/validator-ready && exec 3<>/dev/tcp/127.0.0.1/8080"]
    interval: 30s
    timeout: 5s
    start_period: 900s
    retries: 3

services:
  hl7-validator-twcore:
    <<: *validator
    environment: { VALIDATOR_IG: "tw.gov.mohw.twcore#1.0.0", JAVA_XMX: 2048m }
  hl7-validator-pas:
    <<: *validator
    environment: { VALIDATOR_IG: "tw.gov.mohw.nhi.pas#1.2.7", JAVA_XMX: 2048m }
  hl7-validator-ips:
    <<: *validator
    environment: { VALIDATOR_IG: "hl7.fhir.uv.ips#1.1.0", JAVA_XMX: 2048m }
  hl7-validator-empd:
    <<: *validator
    environment: { VALIDATOR_IG: "tw.gov.mohw.nhi.empd#0.2.1", JAVA_XMX: 2048m }
  hl7-validator-ngs:
    <<: *validator
    environment: { VALIDATOR_IG: "tw.gov.mohw.nhi.ngs#1.0.0", JAVA_XMX: 2048m }
  app:
    depends_on:
      hl7-validator-twcore: { condition: service_healthy, required: false }
      hl7-validator-pas: { condition: service_healthy, required: false }
      hl7-validator-ips: { condition: service_healthy, required: false }
      hl7-validator-empd: { condition: service_healthy, required: false }
      hl7-validator-ngs: { condition: service_healthy, required: false }
    environment:
      OFFICIAL_VALIDATOR_URLS: "tw.gov.mohw.twcore#1.0.0=http://hl7-validator-twcore:8080,tw.gov.mohw.nhi.pas#1.2.7=http://hl7-validator-pas:8080,hl7.fhir.uv.ips#1.1.0=http://hl7-validator-ips:8080,tw.gov.mohw.nhi.empd#0.2.1=http://hl7-validator-empd:8080,tw.gov.mohw.nhi.ngs#1.0.0=http://hl7-validator-ngs:8080"
      OFFICIAL_VALIDATOR_MODE: prefer
      # validator_cli on large Bundles (tx.fhir.org round trips) took > 120 s under the 2-at-a-time acceptance load of 2026-11-08
      # (13 fallbacks in 101 min); 300 s request timeout, validator_cli's own validationTimeout 270 s
      OFFICIAL_VALIDATOR_TIMEOUT_MS: "300000"
      # validation of large Bundles (suggestions, finalize) needs more than the 640 MB of compose.limits.yaml; PAS finalize
      # steadies at ~1.7 GB heap (2 GB OOM-crashed on 2026-11-01). 3072 MB ran out 11 times under the acceptance load of
      # 2026-11-07 (heap at the cap within 4-6 min) — same as production now: 6144 MB heap in an 8 GB container.
      NODE_OPTIONS: --max-old-space-size=6144 --max-semi-space-size=64
      MCP_HEAVY_TOOL_CONCURRENCY: "2"
      MCP_HEAVY_TOOL_QUEUE_TIMEOUT_MS: "240000"
    mem_limit: 8g
    # a crash must not write a multi-GB core dump into the container layer (staging 2026-11-09: 7.4 GB)
    ulimits:
      core: 0
    memswap_limit: 8g
    # no CPU cap, as production (6 = every core of this host): compose.limits.yaml gives the small staging app 1 CPU; with the production
    # heap the V8 GC / marking threads and the libuv pool shared that one CPU with the event loop — CFS throttled the
    # container in 80 % of its periods (8,590 s throttled) and the event loop stalled 10-16 s at a time; at 3 CPUs 33 % (v22 G6)
    cpus: 6
    cpu_shares: 1024
  admin-worker:
    environment:
      OFFICIAL_VALIDATOR_URLS: ""

volumes:
  validator_fhircache:
