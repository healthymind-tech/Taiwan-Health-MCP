# Single front door for Taiwan Health MCP.
#   - API / MCP / WebSocket  -> Python backend (app:8000)
#   - everything else (pages, admin SPA) -> Next.js front-end (web:3000)
#
# Upstreams are resolved at *request time* via Docker's embedded DNS
# (127.0.0.11), not cached at startup. This means rebuilding `app`/`web`
# (which gives them a new container IP) no longer requires restarting nginx.
# The trick: never name them in an `upstream {}` block (those resolve once at
# load) — instead put the host:port in a variable and let `resolver` re-resolve
# it. NOTE: when `proxy_pass` uses a variable it does not append the matched
# location URI, but since no location here rewrites the path, nginx forwards the
# original request URI (and query string) unchanged.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 4g;     # admin source-file uploads (SNOMED RF2 zip can exceed 1GB)

  # Docker embedded DNS; short TTL so a recreated container is picked up quickly.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $th_backend  "app:8000";
  set $th_frontend "web:3000";

  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # ── admin live-log WebSocket ────────────────────────────────────────────────
  location = /admin/ws {
    proxy_pass http://$th_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # ── admin REST API ──────────────────────────────────────────────────────────
  location /admin/api/ {
    proxy_pass http://$th_backend;
    proxy_http_version 1.1;
    proxy_read_timeout 600s;
  }

  # ── admin static assets ─────────────────────────────────────────────────────
  # The marketing site owns the root /_next (Next's own basePath/assetPrefix
  # relocation broke App Router route resolution on 14.2 — 404s on prerendered
  # pages — so this app still builds/serves everything at its own root). We
  # strip the /admin prefix back off here so Next's static file server (which
  # only knows about root-level /_next, /favicon.png, etc.) can serve them
  # unmodified; the matching /admin/ HTML/JS below is then sub_filter-rewritten
  # to reference these /admin/-prefixed URLs instead of the root ones.
  location /admin/_next/ {
    # proxy_pass with a variable upstream forwards the URI unmodified (see the
    # note at the top of this file), so strip the /admin prefix explicitly.
    rewrite ^/admin(/_next/.*)$ $1 break;
    proxy_pass http://$th_frontend;
  }
  location = /admin/favicon.png     { proxy_pass http://$th_frontend/favicon.png; }
  location = /admin/logo-h.png      { proxy_pass http://$th_frontend/logo-h.png; }
  location = /admin/pdf.worker.min.mjs { proxy_pass http://$th_frontend/pdf.worker.min.mjs; }

  # ── admin pages (SPA shell + login) ─────────────────────────────────────────
  # Rewrite the HTML's root-relative asset URLs to the /admin/-prefixed ones
  # above, so the browser never requests /_next, /favicon.png etc. at the
  # domain root (those belong to the marketing site sharing this domain).
  location /admin {
    proxy_pass http://$th_frontend;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;
    # sub_filter can't rewrite a gzip-compressed body; ask Next for plain text
    # (nginx will still gzip its own response back to the client as usual).
    proxy_set_header Accept-Encoding "";
    # Two encodings show up: plain HTML attributes (href="/_next/...") and the
    # RSC payload's JSON-escaped strings (\"/_next/...\", and array literals
    # like HL["/_next/...). Cover both so nothing leaks the root path.
    sub_filter 'href="/_next/'    'href="/admin/_next/';
    sub_filter 'src="/_next/'     'src="/admin/_next/';
    sub_filter '\"/_next/'        '\"/admin/_next/';
    sub_filter '["/_next/'        '["/admin/_next/';
    sub_filter 'href="/favicon.png"' 'href="/admin/favicon.png"';
    sub_filter '\"/favicon.png\"' '\"/admin/favicon.png\"';
    sub_filter '\\\"/favicon.png\\\"' '\\\"/admin/favicon.png\\\"';
    sub_filter 'src="/logo-h.png"'   'src="/admin/logo-h.png"';
    sub_filter 'href="/logo-h.png"'  'href="/admin/logo-h.png"';
    sub_filter '\"/logo-h.png\"'  '\"/admin/logo-h.png\"';
    sub_filter_once off;
  }

  # ── MCP streamable-http (SSE) ───────────────────────────────────────────────
  location = /mcp {
    proxy_pass http://$th_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  # ── other backend-owned endpoints ───────────────────────────────────────────
  location = /openapi.json  { proxy_pass http://$th_backend; }
  location /tools/          { proxy_pass http://$th_backend; }
  location /fhir-client/    { proxy_pass http://$th_backend; }
  location /fhir-oauth/     { proxy_pass http://$th_backend; }

  # TODO: the public landing / status / privacy / dpa pages moved to a standalone
  # marketing site. `/privacy` in particular is the URL registered with the
  # Anthropic Connectors Directory, so these must 301 rather than 404 once the
  # new site has a domain. Fill in <MARKETING_SITE> and uncomment:
  # location = /         { return 301 https://<MARKETING_SITE>/; }
  # location = /privacy  { return 301 https://<MARKETING_SITE>/privacy; }
  # location = /dpa      { return 301 https://<MARKETING_SITE>/dpa; }
  # location = /status   { return 301 https://<MARKETING_SITE>/; }

  # ── everything else: admin SPA (Next.js) ────────────────────────────────────
  location / {
    proxy_pass http://$th_frontend;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;
  }
}
